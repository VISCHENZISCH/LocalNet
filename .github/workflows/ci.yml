name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  verifications:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: python -m pytest -q
      - name: Syntaxe du client web
        if: runner.os == 'Linux'
        run: node --check chat/web/app.js

  executables:
    name: Exécutable ${{ matrix.nom }}
    needs: verifications
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            nom: linux
          - os: windows-latest
            nom: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pyinstaller --noconfirm packaging/localnet.spec
      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../LocalNet-${{ matrix.nom }}.zip" LocalNet
          else tar czf "../LocalNet-${{ matrix.nom }}.tar.gz" LocalNet; fi
      - uses: actions/upload-artifact@v4
        with:
          name: LocalNet-${{ matrix.nom }}
          path: LocalNet-${{ matrix.nom }}.*
      - name: Publier dans la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LocalNet-${{ matrix.nom }}.*
    permissions:
      contents: write
